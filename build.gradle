buildscript {
    repositories {
        google()
    }

    dependencies {
        classpath libs.gradle
    }
}

plugins {
    id 'org.sonarqube' version '3.4.0.2513'
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

sonarqube {
    properties {
        // Root project information
        property 'sonar.projectKey', 'org.simpleadblocker'
        property 'sonar.organization', 'simpleadblocker'
        property 'sonar.projectName', 'SimpleAdBlocker'
        property 'sonar.projectVersion', libs.versions.appName.get()
        property 'sonar.host.url', 'https://sonarcloud.io'
    }
}
